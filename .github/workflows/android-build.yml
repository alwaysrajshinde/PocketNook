name: PocketNook Android Release & OTA Bundle CI

on:
  push:
    branches:
      - ota-test-build
  workflow_dispatch:
    inputs:
      min_native_version_code:
        description: 'Minimum Android versionCode compatible with this web OTA bundle'
        required: true
        default: '1'
      release_notes:
        description: 'Short changelog shown in Android Update prompt'
        required: false
        default: 'Isolated OTA test bundle v2.4.7 (harmless UI label verification).'
      build_apk:
        description: 'Build signed Android Release APK (set false for web-only OTA bundle)'
        type: boolean
        required: true
        default: false
      publish_ota:
        description: 'Publish signed OTA zip to ISOLATED test release & ota-manifest-test branch ONLY'
        type: boolean
        required: true
        default: true
      manifest_url:
        description: 'Isolated test OTA manifest URL (defaults to ota-manifest-test on ota-test-build)'
        required: false
        default: 'https://raw.githubusercontent.com/alwaysrajshinde/PocketNook/ota-manifest-test/update-manifest.json'

permissions:
  contents: write

jobs:
  build_android_and_ota:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (PROD only)
        uses: actions/checkout@v4

      - name: Verify Zero Experimental QA/AI Code
        run: |
          if grep -rnE "WhatsAppChatboxModal|aiAssistantService|cloudflar|chatContextService" client/src/; then
            echo "ERROR: Experimental QA/AI code detected in PROD Android build!"
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Read Version Metadata
        id: meta
        run: |
          if [ "${{ github.ref_name }}" != "ota-test-build" ]; then
            echo "ERROR: Isolated OTA test workflow must ONLY run on ota-test-build!"
            exit 1
          fi
          PKG_VER=$(node -p "require('./client/package.json').version")
          NATIVE_CODE=$(( ${GITHUB_RUN_NUMBER:-1} ))
          SHOULD_BUILD_APK="${{ inputs.build_apk }}"
          SHOULD_PUBLISH_TEST="${{ inputs.publish_ota }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            SHOULD_BUILD_APK="false"
            SHOULD_PUBLISH_TEST="true"
          fi
          echo "web_version=${PKG_VER}" >> "$GITHUB_OUTPUT"
          echo "native_code=${NATIVE_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${PKG_VER}-ota-test" >> "$GITHUB_OUTPUT"
          echo "should_build_apk=${SHOULD_BUILD_APK}" >> "$GITHUB_OUTPUT"
          echo "should_publish_test=${SHOULD_PUBLISH_TEST}" >> "$GITHUB_OUTPUT"

      - name: Build Production Web Bundle
        working-directory: client
        env:
          VITE_IS_QA: 'false'
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_UPDATE_PUBLIC_KEY_JWK: ${{ vars.VITE_UPDATE_PUBLIC_KEY_JWK || secrets.VITE_UPDATE_PUBLIC_KEY_JWK }}
          VITE_UPDATE_MANIFEST_URL: ${{ inputs.manifest_url || 'https://raw.githubusercontent.com/alwaysrajshinde/PocketNook/ota-manifest-test/update-manifest.json' }}
        run: |
          echo "Using VITE_UPDATE_MANIFEST_URL=${VITE_UPDATE_MANIFEST_URL}"
          echo "publish_ota=${{ inputs.publish_ota }}"
          if [[ "$VITE_UPDATE_MANIFEST_URL" == *"/ota-manifest/update-manifest.json"* ]]; then
            echo "ERROR: Isolated test build must NOT target production ota-manifest!"
            exit 1
          fi
          if [ "${{ steps.meta.outputs.should_build_apk }}" = "true" ]; then
            if [ -z "$VITE_GOOGLE_CLIENT_ID" ] || [[ "$VITE_GOOGLE_CLIENT_ID" == *"-web-client."* ]]; then
              echo "ERROR: Missing or placeholder VITE_GOOGLE_CLIENT_ID. Set your Firebase Web application OAuth Client ID in GitHub Secrets/Variables before building the APK."
              exit 1
            fi
          fi
          npm run build
          if ! grep -q "ota-manifest-test/update-manifest.json" dist/assets/*.js; then
            echo "ERROR: Compiled Vite bundle does NOT contain ota-manifest-test/update-manifest.json!"
            exit 1
          fi
          if grep -q "/ota-manifest/update-manifest.json" dist/assets/*.js; then
            echo "ERROR: Compiled Vite bundle still contains production /ota-manifest/update-manifest.json!"
            exit 1
          fi
          echo "Verified compiled dist JS embeds only the test manifest URL."

      - name: Package & Sign Live Web OTA Bundle
        env:
          UPDATE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM }}
          VITE_UPDATE_PUBLIC_KEY_JWK: ${{ vars.VITE_UPDATE_PUBLIC_KEY_JWK || secrets.VITE_UPDATE_PUBLIC_KEY_JWK }}
          EFFECTIVE_MANIFEST_URL: ${{ inputs.manifest_url || 'https://raw.githubusercontent.com/alwaysrajshinde/PocketNook/ota-manifest-test/update-manifest.json' }}
        run: |
          if [ -z "$UPDATE_SIGNING_PRIVATE_KEY_PEM" ]; then
            echo "ERROR: Missing UPDATE_SIGNING_PRIVATE_KEY_PEM secret (never ship unsigned OTA manifests)."
            exit 1
          fi
          mkdir -p ota-artifacts
          ZIP_NAME="pocketnook-web-v${{ steps.meta.outputs.web_version }}.zip"
          (cd client/dist && zip -r "../../ota-artifacts/${ZIP_NAME}" .)
          MANIFEST_TAG="v${{ steps.meta.outputs.web_version }}"
          if [[ "$EFFECTIVE_MANIFEST_URL" == *"ota-manifest-test"* ]]; then
            MANIFEST_TAG="v${{ steps.meta.outputs.web_version }}-ota-test"
          fi
          node scripts/generate-update-manifest.mjs \
            --zip "ota-artifacts/${ZIP_NAME}" \
            --version "${{ steps.meta.outputs.web_version }}" \
            --minNativeCode "${{ inputs.min_native_version_code || '1' }}" \
            --nativeCode "${{ steps.meta.outputs.native_code }}" \
            --bundleUrl "https://github.com/alwaysrajshinde/PocketNook/releases/download/${MANIFEST_TAG}/${ZIP_NAME}" \
            --apkUrl "https://github.com/alwaysrajshinde/PocketNook/releases/download/${MANIFEST_TAG}/PocketNook-v${{ steps.meta.outputs.web_version }}-release.apk" \
            --notes "${{ inputs.release_notes || 'Isolated OTA test bundle verification.' }}" \
            --out "ota-artifacts/update-manifest.json"
          node --input-type=module -e '
            import fs from "node:fs";
            import { buildCanonicalManifestPayload, verifyManifestSignature } from "./client/src/services/appUpdateService.js";
            const manifest = JSON.parse(fs.readFileSync("ota-artifacts/update-manifest.json", "utf8"));
            const jwk = process.env.VITE_UPDATE_PUBLIC_KEY_JWK ? JSON.parse(process.env.VITE_UPDATE_PUBLIC_KEY_JWK) : undefined;
            const res = await verifyManifestSignature(manifest, jwk);
            if (!res.valid) {
              console.error("CRITICAL CI ERROR: OTA manifest signature does NOT match embedded/configured public key:", res.reason);
              process.exit(1);
            }
            console.log("Verified OTA manifest cryptographic signature against app public key:", res.mode, "| payload:", buildCanonicalManifestPayload(manifest));
          '

      - name: Upload Web OTA Bundle & Signed Manifest
        uses: actions/upload-artifact@v4
        with:
          name: pocketnook-web-ota-v${{ steps.meta.outputs.web_version }}
          path: ota-artifacts/
          retention-days: 30

      - name: Setup JDK 21 (Capacitor v8 Requirement)
        if: ${{ steps.meta.outputs.should_build_apk == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        if: ${{ steps.meta.outputs.should_build_apk == 'true' }}
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Verify Android SDK & Build Tools
        if: ${{ steps.meta.outputs.should_build_apk == 'true' }}
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          command -v sdkmanager
          sdkmanager --version

      - name: Sync Capacitor Android Project
        if: ${{ steps.meta.outputs.should_build_apk == 'true' }}
        working-directory: client
        run: npx cap sync android

      - name: Build Signed Release APK
        if: ${{ steps.meta.outputs.should_build_apk == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          POCKETNOOK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          POCKETNOOK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          POCKETNOOK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          POCKETNOOK_VERSION_CODE: ${{ steps.meta.outputs.native_code }}
          POCKETNOOK_VERSION_NAME: ${{ steps.meta.outputs.web_version }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$POCKETNOOK_KEYSTORE_PASSWORD" ] || [ -z "$POCKETNOOK_KEY_ALIAS" ] || [ -z "$POCKETNOOK_KEY_PASSWORD" ]; then
            echo "ERROR: Missing Android signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/pocketnook-release.jks"
          export POCKETNOOK_KEYSTORE_PATH="${RUNNER_TEMP}/pocketnook-release.jks"
          chmod +x client/android/gradlew
          (cd client/android && ./gradlew assembleRelease --no-daemon)
          rm -f "${RUNNER_TEMP}/pocketnook-release.jks"

          APK_OUT="client/android/app/build/outputs/apk/release/app-release.apk"
          mkdir -p apk-artifacts
          APK_ARTIFACT="apk-artifacts/PocketNook-v${{ steps.meta.outputs.web_version }}-release.apk"
          cp "$APK_OUT" "$APK_ARTIFACT"
          echo "=== APK Metadata (Package ID, Version Code, Version Name) ==="
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK_ARTIFACT" | head -n 5
          echo "=== Embedded OTA Manifest URL inside APK ==="
          APK_URLS=$(unzip -p "$APK_ARTIFACT" "assets/public/assets/*.js" | grep -aoE "https://raw\.githubusercontent\.com/[^\"']+/update-manifest\.json" | sort -u || true)
          echo "$APK_URLS"
          if ! echo "$APK_URLS" | grep -q "ota-manifest-test/update-manifest.json"; then
            echo "ERROR: Built APK does NOT contain test manifest URL!"
            exit 1
          fi
          if echo "$APK_URLS" | grep -q "/ota-manifest/update-manifest.json"; then
            echo "ERROR: Built APK still contains production manifest URL!"
            exit 1
          fi
          echo "=== Release APK Certificate Fingerprints (Register SHA-1 in Firebase Console) ==="
          keytool -printcert -jarfile "$APK_ARTIFACT" | grep -E "SHA1|SHA256" || true

      - name: Upload Signed Android Release APK
        if: ${{ steps.meta.outputs.should_build_apk == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pocketnook-android-apk-v${{ steps.meta.outputs.web_version }}
          path: apk-artifacts/
          retention-days: 30

      - name: Publish Isolated Test OTA Pre-Release & Signed ota-manifest-test
        if: ${{ steps.meta.outputs.should_publish_test == 'true' && github.ref_name == 'ota-test-build' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if [[ "$TAG" != *"-ota-test" ]]; then
            echo "ERROR: Refusing to publish non-test tag: $TAG"
            exit 1
          fi
          ZIP_PATH="ota-artifacts/pocketnook-web-v${{ steps.meta.outputs.web_version }}.zip"
          MANIFEST_PATH="ota-artifacts/update-manifest.json"
          ASSETS=("$ZIP_PATH" "$MANIFEST_PATH")

          # Create or update isolated GitHub Pre-Release ONLY
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --prerelease \
              --title "PocketNook ${TAG} (Isolated Test OTA)" \
              --notes "${{ inputs.release_notes || 'Isolated test channel OTA bundle verification.' }}" \
              --target "${{ github.sha }}"
          fi

          # Verify uploaded GitHub Release asset returns HTTP 200 and matches exact manifest SHA-256 BEFORE publishing manifest
          EXPECTED_SHA=$(node -p "JSON.parse(require('fs').readFileSync('${MANIFEST_PATH}', 'utf8')).sha256")
          BUNDLE_URL=$(node -p "JSON.parse(require('fs').readFileSync('${MANIFEST_PATH}', 'utf8')).bundleUrl")
          curl -fsSL "$BUNDLE_URL" -o "${RUNNER_TEMP}/downloaded-ota.zip"
          ACTUAL_SHA=$(sha256sum "${RUNNER_TEMP}/downloaded-ota.zip" | awk '{print tolower($1)}')
          rm -f "${RUNNER_TEMP}/downloaded-ota.zip"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Uploaded test asset SHA-256 mismatch ($ACTUAL_SHA vs $EXPECTED_SHA)!"
            exit 1
          fi
          echo "Verified HTTP 200 + SHA-256 match for $BUNDLE_URL ($ACTUAL_SHA)"

          # Push signed update-manifest.json ONLY to ota-manifest-test branch (NEVER production ota-manifest)
          TMP_OTA=$(mktemp -d)
          cp "$MANIFEST_PATH" "${TMP_OTA}/update-manifest.json"
          (
            cd "$TMP_OTA"
            git init -b ota-manifest-test
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add update-manifest.json
            git commit -m "ota-test: publish signed update-manifest ${TAG}"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git push --force origin ota-manifest-test
          )
          rm -rf "$TMP_OTA"
